name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Build paired WTSCLI release assets
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm run build:seektalent-bundle -- --out "$RUNNER_TEMP/wtscli-bundle"
          mkdir release-assets
          cp "$RUNNER_TEMP"/wtscli-bundle/runtime/*.tgz release-assets/
          cp "$RUNNER_TEMP"/wtscli-bundle/bridge-manifest.json release-assets/
          (
            cd "$RUNNER_TEMP/wtscli-bundle/extension"
            zip -r "$GITHUB_WORKSPACE/release-assets/wtscli-extension-v${VERSION}.zip" .
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*
